name: Release

# Pushing a `vX.Y.Z` tag runs verification, then publishes to npm (with
# provenance) and cuts a GitHub release. The wasm is tracked in git, and
# prepack re-checks both sha256s against circuit.json before publishing.
#
# workflow_dispatch exists to re-run a release for an existing tag (pick the
# tag in the "Use workflow from" dropdown).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Releases run from a tag (vX.Y.Z), not '$GITHUB_REF'."
            exit 1
          fi
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: |
          flags=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
