name: Release

# Pushing a `vX.Y.Z` tag runs verification, then tries to publish to npm and
# cut a GitHub release. Publishing is currently BLOCKED by design: the tarball
# must contain wasm/mist.wasm, which CI cannot obtain (see the guard below),
# so until core ships a wasm release asset the publish job fails on purpose
# and releases are done by hand. See RELEASING.md.
#
# workflow_dispatch exists to re-run a release for an existing tag (pick the
# tag in the "Use workflow from" dropdown), e.g. once the wasm can be fetched.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Same acknowledgement as ci.yml: the wasm is not available to CI.
      MIST_ALLOW_WASM_SKIP: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Releases run from a tag (vX.Y.Z), not '$GITHUB_REF'."
            exit 1
          fi
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg."
            exit 1
          fi

      # TODO: replace this guard with a step that downloads mist.wasm from a
      # core release asset (and runs scripts/sync-wasm.mjs-equivalent checks)
      # once one exists. prepack still verifies the sha256 against circuit.json.
      - name: Require wasm/mist.wasm
        run: |
          if [ ! -f wasm/mist.wasm ]; then
            echo "::error::wasm missing: publish from a host with core-deploy until core ships a wasm release asset. See RELEASING.md."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: |
          flags=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
