name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # package.json engines is ^20.19 || >=22.12. The whole job takes about
        # a minute, so covering both supported majors costs next to nothing.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The tracked wasm must be the one circuit.json records (same check as
      # prepack), so a stale or hand-edited binary fails here, not at publish.
      - name: Check wasm/ against circuit.json
        run: node scripts/prepack.mjs
      - run: npm run verify
